<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coucou Browser Intent</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 12px 14px;
      background: #0f1115;
      color: #f3f4f6;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .title {
      font-weight: 700;
      font-size: 13px;
    }
    .badge {
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }
    .row {
      margin-bottom: 8px;
      padding: 7px 9px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .lbl {
      font-size: 10px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .val {
      font-weight: 600;
      font-size: 12.5px;
      margin-top: 2px;
      word-break: break-all;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      padding: 5px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #181b22;
      color: #e5e7eb;
      font-size: 11px;
    }
    button {
      width: 100%;
      margin-top: 6px;
      padding: 6px 10px;
      border: 0;
      border-radius: 7px;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
      font-size: 11.5px;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="head">
    <span class="title">Coucou Intent</span>
    <span id="status" class="badge">Ready</span>
  </div>
  <div class="row">
    <div class="lbl">Active Domain (Hostname Only)</div>
    <div id="domain" class="val">—</div>
  </div>
  <div class="row">
    <div class="lbl">Classification</div>
    <div id="category" class="val">neutral</div>
  </div>
  <div class="row">
    <div class="lbl">Token (from ~/.config/coucou/browser-token.txt)</div>
    <input id="token" type="password" placeholder="Auto-synced token" />
    <button id="save">Save & Sync Active Tab</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
